# Rust-Shell - A Rust implementation of GNU Bash
# Copyright 2024-2026 Rust-Shell Contributors
# License: MIT

[package]
name = "rubash"
version = "1.4.1"
edition = "2021"
rust-version = "1.70"
authors = ["unixwin team <arookieofc@gmail.com>"]
description = "A Rust implementation of the GNU Bash shell"
readme = "README.md"
homepage = "https://github.com/unixwin/rubash"
repository = "https://github.com/unixwin/rubash"
license = "MIT"
keywords = ["shell", "bash", "cli", "posix"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".github/**",
    "Cargo.toml.orig",
    "memory/**",
    "target/**",
    "target*/**",
    "third_party/**",
    "tests/**",
]

[[bin]]
name = "bash"
path = "src/bin/bash.rs"

[dependencies]
regex = "1"
os_pipe = "1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_Time", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

# rubash#827: build.rs stamps a `-dirty-<8 hex>` digest of the uncommitted
# diff into the version banner (#488: a bare HEAD hash does not guarantee
# content). The #[path]-included unit test (tests/build_rs_dirty.rs)
# compiles build.rs into a test target, so sha2 must be a dev-dependency as
# well as a build-dependency.
[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
pretty_assertions = "1.4"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0