<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" role="img" aria-label="rubash milestone timeline — from a 3,427-line GNU-suite diff to 83/83 upstream test suites passing">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08f8f8"/>
      <stop offset="1" stop-color="#38b6ff"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5080"/>
      <stop offset="0.5" stop-color="#38b6ff"/>
      <stop offset="1" stop-color="#08f8f8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="648" rx="28" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="957" height="645" rx="26.5" fill="none" stroke="#2a3a60" stroke-width="3"/>

  <!-- header -->
  <text x="48" y="58" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="2" fill="#f0f6fc">THE CLIMB</text>
  <text x="912" y="58" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fa3c0">949 issues filed · 409 PRs merged · 2026</text>
  <text x="48" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8fa3c0">a from-scratch bash engine measured against GNU's own test suite — 3,427 diff lines in September, 83/83 passing in October</text>
  <line x1="48" y1="104" x2="912" y2="104" stroke="#2a3a60" stroke-width="2"/>

  <!-- spine -->
  <line x1="150" y1="114" x2="150" y2="556" stroke="url(#spine)" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="556" x2="150" y2="580" stroke="#38b6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>

  <!-- dates -->
  <g font-family="Consolas,Menlo,'Courier New',monospace" font-size="13">
    <text x="134" y="137" text-anchor="end" fill="#5a6b8a">Jan 23</text>
    <text x="134" y="173" text-anchor="end" fill="#7e93b8">Jun 11</text>
    <text x="134" y="209" text-anchor="end" fill="#7e93b8">Aug 3</text>
    <text x="134" y="245" text-anchor="end" fill="#7e93b8">Aug 22</text>
    <text x="134" y="281" text-anchor="end" fill="#7e93b8">Sep 2</text>
    <text x="134" y="317" text-anchor="end" fill="#7e93b8">Sep 9</text>
    <text x="134" y="353" text-anchor="end" fill="#7e93b8">Sep 22</text>
    <text x="134" y="389" text-anchor="end" fill="#7e93b8">Sep 27</text>
    <text x="134" y="425" text-anchor="end" fill="#7e93b8">Oct 4</text>
    <text x="134" y="461" text-anchor="end" fill="#7e93b8">Oct 10</text>
    <text x="134" y="497" text-anchor="end" fill="#08f8f8">Oct 12</text>
    <text x="134" y="533" text-anchor="end" fill="#7e93b8">Oct 22</text>
    <text x="134" y="569" text-anchor="end" fill="#5a6b8a">next</text>
  </g>

  <!-- nodes -->
  <g fill="#0b1020" stroke="#08f8f8" stroke-width="2">
    <circle cx="150" cy="132" r="4" stroke="#4a5f88"/>
    <circle cx="150" cy="168" r="4.5"/>
    <circle cx="150" cy="204" r="4.5"/>
    <circle cx="150" cy="240" r="4.5"/>
    <circle cx="150" cy="276" r="4.5"/>
    <circle cx="150" cy="312" r="4.5"/>
    <circle cx="150" cy="348" r="4.5"/>
    <circle cx="150" cy="384" r="4.5"/>
    <circle cx="150" cy="420" r="4.5"/>
    <circle cx="150" cy="456" r="4.5"/>
  </g>
  <circle cx="150" cy="528" r="4.5" fill="#0b1020" stroke="#08f8f8" stroke-width="2"/>
  <circle cx="150" cy="564" r="5.5" fill="none" stroke="#5a6b8a" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- summit node = gold star on the spine -->
  <path d="M150,478 L152.6,486.7 L161.5,486.9 L154.7,492.2 L157.2,500.9 L150,496 L142.8,500.9 L145.3,492.2 L138.5,486.9 L147.4,486.7 Z" fill="#ffd76a"/>
  <circle cx="150" cy="492" r="14" fill="none" stroke="#ffd76a" stroke-width="1.5" opacity="0.3"/>

  <!-- rows -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5">
    <text x="172" y="137"><tspan font-weight="700" fill="#8fa3c0">WinuxCmd ships</tspan><tspan fill="#5a6b8a"> — the family begins: 176 Unix commands rebuilt natively for Windows</tspan></text>
    <text x="172" y="173"><tspan font-weight="700" fill="#eef4fc">rubash begins</tspan><tspan fill="#8fa3c0"> — a bash engine written from scratch in Rust: lexer, parser, executor</tspan></text>
    <text x="172" y="209"><tspan font-weight="700" fill="#eef4fc">the great audit</tspan><tspan fill="#8fa3c0"> — 1,345 divergences from real shells measured across six corpora</tspan></text>
    <text x="172" y="245"><tspan font-weight="700" fill="#eef4fc">v0.3.0</tspan><tspan fill="#8fa3c0"> — process substitution, programmable completion, real alias semantics</tspan></text>
    <text x="172" y="281"><tspan font-weight="700" fill="#eef4fc">niubash 1.0.0</tspan><tspan fill="#8fa3c0"> — the Windows shell product ships, powered by this engine</tspan></text>
    <text x="172" y="317"><tspan font-weight="700" fill="#eef4fc">3,427 diff lines</tspan><tspan fill="#8fa3c0"> — full GNU suite measured for the first time; the real distance, published</tspan></text>
    <text x="172" y="353"><tspan font-weight="700" fill="#eef4fc">engineering rules</tspan><tspan fill="#8fa3c0"> — bug families mapped across 2,566 commits; POSIX fd semantics proven on Win32</tspan></text>
    <text x="172" y="389"><tspan font-weight="700" fill="#eef4fc">first speed baseline</tspan><tspan fill="#8fa3c0"> — 24 benchmarks against GNU 5.3, gaps published instead of hidden</tspan></text>
    <text x="172" y="425"><tspan font-weight="700" fill="#eef4fc">v1.3.2</tspan><tspan fill="#8fa3c0"> — first release shipping Windows, Linux and macOS together</tspan></text>
    <text x="172" y="461"><tspan font-weight="700" fill="#eef4fc">v1.4.0</tspan><tspan fill="#8fa3c0"> — diff cut 40% in one release · real readline · login shells · Android builds</tspan></text>
    <text x="172" y="497"><tspan font-weight="800" fill="#08f8f8">83/83 GNU TEST SUITES PASS</tspan><tspan fill="#8fa3c0"> — the one residual line turned out to be GNU's own race</tspan></text>
    <text x="172" y="533"><tspan font-weight="700" fill="#eef4fc">real programs run</tspan><tspan fill="#8fa3c0"> — bashdb debugger, 29k-line ble.sh, oh-my-bash; faster than Git Bash on 8/8 benchmarks</tspan></text>
    <text x="172" y="569"><tspan font-weight="700" fill="#8fa3c0" font-style="italic">v1.5.0</tspan><tspan fill="#5a6b8a" font-style="italic"> — split into a library anyone can embed · native debugger in design</tspan></text>
  </g>

  <text x="480" y="620" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="12" fill="#5a6b8a">the unixwin family — rubash · niubash · WinuxCmd · niu-git · wpm · oh-my-niu</text>
</svg>
