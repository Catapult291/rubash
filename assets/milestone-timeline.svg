  <circle cx="150" cy="528" r="4.5" fill="#0b1020" stroke="#08f8f8" stroke-width="2"/>
  <circle cx="150" cy="564" r="5.5" fill="none" stroke="#5a6b8a" stroke-width="2" stroke-dasharray="3 3"/>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5">
    <text x="172" y="137"><tspan font-weight="700" fill="#8fa3c0">WinuxCmd begins</tspan><tspan fill="#5a6b8a"> — the unixwin family starts: 176 native Unix commands for Windows</tspan></text>
    <text x="172" y="173"><tspan font-weight="700" fill="#eef4fc">rubash · chore: init · v0.1.0</tspan><tspan fill="#8fa3c0"> — lexer · parser · executor · builtins (58 tests)</tspan></text>
    <text x="172" y="209"><tspan font-weight="700" fill="#eef4fc">the 1,345-diff audit</tspan><tspan fill="#8fa3c0"> — six foreign corpora triaged → root-cause families (#20–#26)</tspan></text>
    <text x="172" y="245"><tspan font-weight="700" fill="#eef4fc">v0.3.0</tspan><tspan fill="#8fa3c0"> — process substitution · compgen/complete surface · parser-level alias</tspan></text>
    <text x="172" y="281"><tspan font-weight="700" fill="#eef4fc">niubash 1.0.0</tspan><tspan fill="#8fa3c0"> — winuxsh → niubash; the product shell ships on the engine</tspan></text>
    <text x="172" y="317"><tspan font-weight="700" fill="#eef4fc">3,427 raw diff lines</tspan><tspan fill="#8fa3c0"> — the bottom of the ledger; every miss per-line classified</tspan></text>
    <text x="172" y="353"><tspan font-weight="700" fill="#eef4fc">the governance wave</tspan><tspan fill="#8fa3c0"> — 2,566-commit taxonomy · #117 no-whack-a-mole · fd-table POC</tspan></text>
    <text x="172" y="389"><tspan font-weight="700" fill="#eef4fc">first perf baseline</tspan><tspan fill="#8fa3c0"> — 24 probes vs GNU 5.3; honest reds published</tspan></text>
    <text x="172" y="425"><tspan font-weight="700" fill="#eef4fc">v1.3.2</tspan><tspan fill="#8fa3c0"> — first three-platform release: Windows · Linux · macOS</tspan></text>
    <text x="172" y="461"><tspan font-weight="700" fill="#eef4fc">v1.4.0</tspan><tspan fill="#8fa3c0"> — 3,427 → 2,072 diff lines (−40%) · real readline · MSYS2 persona</tspan></text>
    <text x="172" y="497"><tspan font-weight="800" fill="#08f8f8">83/83 GNU UPSTREAM SUITES</tspan><tspan fill="#8fa3c0"> — sole residual line proven to be GNU's own race</tspan></text>
    <text x="172" y="533"><tspan font-weight="700" fill="#eef4fc">v1.4.3 · the ecosystem wall</tspan><tspan fill="#8fa3c0"> — bashdb · ble.sh · oh-my-bash · 8/8 workloads faster than Git Bash</tspan></text>
    <text x="172" y="569"><tspan font-weight="700" fill="#8fa3c0" font-style="italic">v1.5.0</tspan><tspan fill="#5a6b8a" font-style="italic"> — workspace split → embeddable engine API · DAP-first debugger</tspan></text>
  </g>

  <!-- summit star -->
  <path d="M920,479 L922.1,485.1 L928.6,485.2 L923.4,489.1 L925.3,495.3 L920,491.6 L914.7,495.3 L916.6,489.1 L911.4,485.2 L917.9,485.1 Z" fill="#ffd76a"/>

  <text x="480" y="620" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="12" fill="#5a6b8a">the unixwin family — rubash · niubash · WinuxCmd · niu-git · wpm · oh-my-niu</text>
