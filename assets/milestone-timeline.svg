<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" role="img" aria-label="rubash milestone timeline — from a 3,427-line GNU-suite diff to 83/83 upstream suites">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08f8f8"/>
      <stop offset="1" stop-color="#38b6ff"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a60"/>
      <stop offset="0.55" stop-color="#38b6ff"/>
      <stop offset="1" stop-color="#08f8f8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="648" rx="28" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="957" height="645" rx="26.5" fill="none" stroke="#2a3a60" stroke-width="3"/>

  <!-- header -->
  <text x="48" y="58" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="2" fill="#f0f6fc">THE CLIMB</text>
  <text x="912" y="58" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fa3c0">949 issues · 409 PRs · Jan → Oct 2026</text>
  <text x="48" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8fa3c0">from a 3,427-line GNU-suite diff to 83/83 passing — measured, not claimed</text>
  <line x1="48" y1="104" x2="912" y2="104" stroke="#2a3a60" stroke-width="2"/>

  <!-- spine -->
  <line x1="150" y1="114" x2="150" y2="556" stroke="url(#spine)" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="556" x2="150" y2="580" stroke="#38b6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>

  <!-- row template: date (right-aligned mono) · dot · title — detail -->
